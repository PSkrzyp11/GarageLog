[project]
name = "garagelog"
version = "0.1.0"
description = "Car service history and running-cost tracker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# The app is run from the source tree, not installed as a package.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
