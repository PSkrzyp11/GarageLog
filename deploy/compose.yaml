# GarageLog on a public server, behind Caddy (automatic HTTPS from Let's Encrypt).
# Run from this folder:  docker compose up -d --build   — settings: deploy/.env (see README).
#
# Differences from the development compose.yaml in the repository root:
# - only Caddy is reachable from outside (ports 80 and 443); the app and the database are not;
# - APP_ENV=production: Secure cookies, HSTS, the app refuses to start without a real SECRET_KEY;
# - passwords and keys must be set in .env (no defaults);
# - containers start again after a server reboot.
name: garagelog-prod

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: garagelog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: garagelog
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garagelog -d garagelog"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ..
    restart: unless-stopped
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/.env}
      DATABASE_URL: postgresql+psycopg://garagelog:${POSTGRES_PASSWORD}@db:5432/garagelog
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      # uvicorn takes the visitor's address and https from Caddy's X-Forwarded-* headers.
      # Trusting any sender is safe only because the app port is not published: Caddy is
      # the only way in. Without this the login limit would see every visitor as Caddy.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: postgres:18
    restart: unless-stopped
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: garagelog
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: garagelog
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: Europe/Warsaw
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ../scripts/backup.sh:/usr/local/bin/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"  # needed for the Let's Encrypt check and the redirect to https
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data  # certificates: keep them, Let's Encrypt limits re-issuing
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
  caddy-config:
