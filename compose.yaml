services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garagelog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garagelog}
      POSTGRES_DB: ${POSTGRES_DB:-garagelog}
    # Bound to localhost only, so the database is not reachable from the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Since PostgreSQL 18 the image keeps its data under /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key-change-me}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-garagelog}:${POSTGRES_PASSWORD:-garagelog}@db:5432/${POSTGRES_DB:-garagelog}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # A database dump every day into ./backups (or BACKUP_DIR); see scripts/backup.sh.
  # Same image as the database, so pg_dump matches the server version.
  backup:
    image: postgres:18
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-garagelog}
      PGPASSWORD: ${POSTGRES_PASSWORD:-garagelog}
      PGDATABASE: ${POSTGRES_DB:-garagelog}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: Europe/Warsaw  # file names use the local date and time
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
